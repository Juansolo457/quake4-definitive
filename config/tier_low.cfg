// Graphics tier "low" (under 4 GB of video memory, or integrated graphics), applied after definitive.cfg.
// As "medium", and the 3D view renders at 85% (r_temporalAA 2 resolves it back to native).
seta r_multiSamples 0
seta r_postAA 1
seta r_useShadowMap 0
seta image_anisotropy 2
seta image_usePrecompressedTextures 1
seta r_screenFraction 85
seta com_maxfps 60
seta com_performancePreset performance
