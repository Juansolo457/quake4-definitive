// Graphics tier "medium" (4 to 8 GB of video memory), applied after definitive.cfg.
// SMAA only, the stock stencil shadows, and the stock compressed textures
// (about a quarter of the memory; loose hi-res packs are not loaded).
seta r_multiSamples 0
seta r_postAA 1
seta r_useShadowMap 0
seta image_anisotropy 4
seta image_usePrecompressedTextures 1
seta com_maxfps 120
seta com_performancePreset balanced
