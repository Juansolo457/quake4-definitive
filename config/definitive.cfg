// Quake 4 Definitive Edition defaults (openQ4 + PC assets + Xbox 360 controller feel)
// Applied once by tools/launch_definitive.ps1; after that the in-game settings win.
// Baseline: clean at native 4K, authored Quake 4 look, frame rate capped at 240.

// ---- Display and frame rate
seta r_fullscreen 1
seta r_fullscreenDesktop 1            // borderless desktop fullscreen at native resolution
seta r_mode -2
seta r_screenFraction 100
seta com_maxfps 240                   // cap; never above 240
seta r_swapInterval -1                // adaptive vsync: no tearing at or under refresh, tears only when a frame is late
seta g_fov 90                         // 4:3 basis, widened automatically (about 106 degrees horizontal at 16:9)

// ---- Anti-aliasing: 4x MSAA for geometry plus SMAA for shader edges
seta r_multiSamples 4
seta r_postAA 1
seta r_msaaAlphaToCoverage 1          // fences and foliage
seta r_temporalAA 2                   // TAA only when rendering below native (resolution scale)

// ---- Textures: full resolution, best filtering
seta com_machineSpec 3
seta image_downSize 0
seta image_ignoreHighQuality 0
seta image_usePrecompressedTextures 2 // ignore the stock DXT/RXGB .dds copies: load uncompressed .tga sources
                                      // (stock "Ultra" quality, no DXT blockiness) and let loose hi-res packs win;
                                      // BC7 replacement packs still load. 1 would prefer the stock .dds in the PK4s.
seta image_picmip 0
seta image_anisotropy 16

// ---- Shadows: shadow maps instead of stencil volumes, soft PCSS-lite edges
seta r_shadows 1
seta r_useShadowMap 1
seta r_shadowMapSize 2048
seta r_shadowMapFilterMode 2

// ---- Lighting: baked indirect light grids on; optional post effects off (authored look)
seta r_useLightGrid 1
seta r_ssao 0
seta r_bloom 0
seta r_hdrToneMap 0
seta r_motionBlur 0

// ---- Controller (Xbox 360 feel)
seta in_joystick 1
seta in_joystickXenon 1
seta pm_AimAssist 3
seta in_promptStyle 0                 // glyphs follow the connected controller

// ---- Menu label
seta com_performancePreset quality
